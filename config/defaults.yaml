# Default configuration for Local Coding Assistant
# This file provides fallback values when no other configuration is specified

# Environment variables can override these defaults using the LOCCA_ prefix:
# LOCCA_LLM__TEMPERATURE, LOCCA_LLM__MAX_TOKENS, etc.

llm:
  # LLM generation settings
  temperature: 0.2
  max_tokens: 3000
  timeout: 120
  max_retries: 1
  retry_delay: 1.0
  capture_reasoning: true
  reasoning_max_chars: 3000
  # Whether to automatically register unmapped models with LiteLLM to bypass cost mapping
  auto_register_litellm_models: true
  # Providers will be dynamically managed at runtime
  providers: []

runtime:
  # Default runtime behavior
  persistent_sessions: false
  max_session_history: 100
  # In-memory session file-version retention (LRU eviction by turn watermark)
  session_retention_enabled: true
  session_retention_max_turns: 50
  enable_logging: true
  log_level: "INFO"
  agent_mode: "frame"
  stream: true
  # Tool calling mode: 'classic' (default), 'ptc' (programmatic tool calling), 'reasoning_only' (no tool calls)
  tool_call_mode: "classic"
  # Context resolution mode: 'static' (default) uses the same config for all turns in one session, 'dynamic' uses current config for each turn
  session_context_resolution: "static"
  # Continuation policy configuration
  continuation_policy:
    max_frames_per_turn: 15
    max_generation_retries: 2
    max_compaction_retries: 1
    # Transient provider-error retries: honor Retry-After hints, otherwise
    # exponential backoff from the base delay (clamped to the max).
    respect_retry_after: true
    transient_retry_base_delay: 1.0
    transient_retry_max_delay: 60.0
    # Tool retry configuration for retryable infrastructure failures
    # (timeout, backend failure, connection error)
    tool_retry_max_retries: 2
    tool_retry_base_delay: 1.0
    tool_retry_max_delay: 30.0
    # Time before approval request expires
    approval_timeout_seconds: 3000
    loop_detection:
      max_repetitions: 3
      window_size: 5
      enabled: true
      check_consecutive: true
      check_window_repetitions: true
    token_budget:
      input_max_tokens: 1000000
      output_max_tokens: 100000
      warn_threshold: 0.8
    deadline:
      timeout_seconds: 3000
      warn_threshold: 0.2

dashboard:
  # Dashboard configuration
  enabled: true
  port: 8080
  host: "localhost"
  auto_start: false  # Whether to auto-start dashboard with LOCCA

providers: {}

agent:
  # Agent profiles define different behaviors and configurations
  profiles:
    default:
      name: "default"
      kind: "default"
      description: "Primary coding assistant focused on safe, step-by-step reasoning with practical guidance."
      goals:
        - "Deliver concise answers grounded in repository state"
        - "Surface trade-offs and assumptions explicitly"
      tone: "Confident, pragmatic, collaborative"
      constraints:
        - "Never fabricate file paths or code"
        - "Prefer actionable steps over vague suggestions"
      model_policy: "general"

    planner:
      name: "planner"
      kind: "planner"
      description: "Decomposes the request into executable steps and highlights risks."
      goals:
        - "Summarize objectives"
        - "Outline numbered plan with verification points"
      tone: "Analytical and structured"
      model_policy: "planning_mode"

    executor:
      name: "executor"
      kind: "executor"
      description: "Executes the plan, writes code, and validates results."
      goals:
        - "Apply plan precisely"
        - "Capture diffs and side-effects"
        - "Report blockers or verifications needed"
      tone: "Hands-on and detail oriented"
      model_policy: "general"

  # Include your custom policies directly
  policies:
    # Plan mode with strong reasoning
    planning_mode:
      models:
        - "mistral-ai/Codestral-2501"
        - "z-ai/glm-4.5-air:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "exponential"

    # Custom policy with exponential backoff
    coding_task:
      models:
        - "mistral-ai/Codestral-2501"
        - "kwaipilot/kat-coder-pro:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "exponential"

    # Fast policy for simple tasks
    general:
      models:
        - "cohere/north-mini-code:free"
        - "nvidia/nemotron-3-ultra-550b-a55b:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "sequential"

    # Cost-optimized policy
    budget_mode:
      models:
        - "kwaipilot/kat-coder-pro:free"
        - "github_models:microsoft/Phi-4"
        - "fallback:any"
      max_failovers: 1
      fallback_strategy: "sequential"

# Prompt template configuration
prompt:
  # Root directory for prompt templates (set to null to use package defaults)
  template_root: null
  
  # Jinja2 environment settings
  enable_jinja_autoescape: false
  trim_blocks: true
  lstrip_blocks: true
  
  # Template paths (relative to template_root)
  templates:
    identity_base: "base/identity.jinja2"
    personality: "base/personality.jinja2"
    model_default: "base/model_default.jinja2"
    model_gemini: "base/model_gemini.jinja2"
    static_env: "blocks/static_env.jinja2"
    agents_md: "blocks/agents_md.jinja2"
    global_rules: "blocks/global_rules.jinja2"
    config_overrides: "blocks/config_rules.jinja2"
    skills: "blocks/skills.jinja2"
    memories: "blocks/memories.jinja2"
    examples: "blocks/examples.jinja2"
    repo_metadata: "blocks/repo_metadata.jinja2"
    repo_map: "blocks/repo_map.jinja2"
    constraints: "blocks/constraints.jinja2"
    safety: "blocks/safety.jinja2"
    output_format: "blocks/output_format.jinja2"
    classic_tools_mode: "modes/classic_tools.jinja2"
    sandbox_python_mode: "modes/sandbox_python.jinja2"
    sandbox_shell_mode: "modes/sandbox_shell.jinja2"
    reasoning_only_mode: "modes/reasoning_only.jinja2"
    default_agent: "agents/default.jinja2"
    planner_agent: "agents/planner.jinja2"
    executor_agent: "agents/executor.jinja2"
    compaction_agent: "agents/compaction.jinja2"
    subagent_agent: "agents/subagent.jinja2"
    planner_extra: "agents/planner_extra.jinja2"
    executor_extra: "agents/executor_extra.jinja2"
  
  # Agent preset registries
  presets:
    default: "default"
    compaction: "compaction"
    subagent: "subagent"
    planner: "planner"
    executor: "executor"
  
  # AGENTS.md configuration
  agents_md:
    enabled: true
    walk_up: true
    filenames: ["AGENTS.md", "CLAUDE.md", "LOCCA.md"]
    global_paths:
      - "~/.config/locca/AGENTS.md"
      - "~/.claude/CLAUDE.md"
  
  # Config instructions
  config_instructions: []

sandbox:
  enabled: false
  image: "locca-sandbox:latest"
  timeout: 30
  memory_limit: "512m"
  cpu_limit: 0.5
  network_enabled: false
  max_code_length: 10000
  max_file_size: 1048576
  allowed_directories:
    - '/workspace'
  working_directory: "/workspace"
  session_timeout: 300
  max_sessions: 5
  session_id: "default"
  persistence: true
  # Security settings
  # By default, we allow all imports and patterns because we rely on Docker isolation.
  # The agent needs to be able to run code, open files, and install packages.
  allowed_imports:
    - json
    - yaml
    - datetime
    - pathlib
    - typing
    - re
    - math
    - random
    - time
    - collections
    - itertools
    - functools
    - tools_api
    # - requests
  blocked_patterns:
    - "eval\\("
    - "exec\\("
    - "__import__"
    - "compile\\("
    - "globals\\("
    - "locals\\("
    - "open\\("
    - "os\\."
    - "shutil\\."
    - "getattr\\(__builtins__"
    - "getattr\\(__builtins__,"
    - "builtins\\."
  blocked_shell_commands:
    - "rm"
    - "mv"
    - "cp"
    - "dd"
    - "chmod"
    - "chown"
    - "sudo"
    - "su"
    - "mount"
    - "umount"
    - "curl"
    - "wget"
    - "scp"
    - "nc"
    - "netcat"
    - "ssh"
    - "iptables"
    - "systemctl"
    - "service"
    - "kill"
    - "pkill"
    - "ps"
    - "top"
    - "nmap"
    - "python"
    - "pip"
    - "systemctl"
    - "service"
    - "shutdown"
    - "reboot"
    - "ftp"
    - "venv"
    - "virtualenv"
  # Logging configuration
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    console: true  # Enable console logging
    file: true  # Enable file logging
    directory: "/workspace/logs"  # Directory to store log files (inside container)
    file_name: "container_{session_id}.log"  # Log file name pattern
    max_size: 10485760  # Maximum log file size in bytes before rotation (10MB)
    backup_count: 5  # Number of backup log files to keep

# Repository context service configuration
repository:
  enabled: true

  # Storage settings
  storage:
    mode: "temporary"  # 'temporary' or 'persistent'
    persistent_db_path: ".locca/repo_context.db"
    temp_db_dir: "@data/temp"
    temp_db_naming_strategy: "path_hash"  # 'path_hash' (folder_name_hash) or 'uuid'
    max_cum_file_size: 25000000  # Maximum cumulative file size in bytes to index in temporary storage (25MB)

  # File filtering settings (for re-indexing only)
  file_filter:
    supported_extensions:
      - ".py"
      - ".js"
      - ".jsx"
      - ".ts"
      - ".tsx"
      - ".rs"
      - ".go"
      - ".c"
      - ".cpp"
      - ".h"
      - ".hpp"
    max_file_size_kb: 500  # 500KB default

  # File monitoring settings (git-tracked only)
  file_monitoring:
    enabled: true
    use_git_tracking: true # Monitor files if they are git tracked
    notify_on_changes: true  # Emit system notifications for file changes
    notification_types:
      - "modified"
      - "created"
      - "deleted"

  # AST parsing settings
  ast_parser:
    language_pack: "tree-sitter-language-pack"

  # Repo map settings
  repo_map:
    max_symbols: 100  # Maximum number of symbols to include in repo map (pageranked)
    include_docstrings: false
    include_imports: false
    # Symbol types to include in repo map (for pageranking)
    included_symbol_types:
      - "function"
      - "method"
      - "class"
      - "interface"
      - "type_alias"

  # Call graph settings
  call_graph:
    # Per-language relationship weights for PageRank computation
    # Higher weights give more importance to that relationship type in the ranking
    relationship_weights:
      python:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      javascript:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      typescript:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      rust:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      go:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      # Default weights for unsupported languages
      default:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0

  # Indexing settings
  indexing:
    startup_enabled: true
    startup_parallel_workers: 4
    agent_edit_enabled: true
    user_edit_enabled: true
    debounce_window: 2.0
    max_cumulative_file_size_kb: 10000  # Max cumulative file size for batch indexing (default 10MB)

# Tools platform configuration
tools_platform:
  backend: host  # host | docker
  exposed_tools: auto  # 'auto' = all backend-compatible tools, or an explicit list of tool IDs
  default_policy: ask  # allow | deny | ask (approval default when no rule matches)
  allow_network: false  # global default network access for commands
  non_interactive: false  # if true, 'ask' becomes a typed blocked result
  auto_approve: false  # if true, 'ask' becomes a typed allowed result
  workspace_root: "@target"  # path alias resolved through PathManager
  env_allowlist: null  # null = pass environment through; list = only these keys reach commands
  max_output_bytes: 262144
  max_read_lines: 400
  max_search_matches: 200
  normalize_to_lf_line_endings: true  # normalize CRLF/CR to LF for LLM-facing reads and edit matching; baseline/snapshots stay raw
  # Configurable paths for tool policies files (supports @ aliases)
  tool_policies_path: "@config/tool_policies.yaml"
  tool_policies_local_path: "@config/tool_policies.local.yaml"
  path_policy:
    allowed_patterns:
      - "**"
    denied_patterns: []
    allow_symlinks: false
    max_depth: null
  ignore_policy:
    # List of ignore filenames in order of precedence (higher index = higher priority)
    files:
      - .gitignore
      - .aiignore
  snapshots:
    enabled: true
    directory: "@data/workspace_snapshots"
    max_snapshots: 10
    max_snapshot_age_days: 30
  timeout:
    soft_seconds: 10
    hard_seconds: 300
    idle_seconds: 30
    heartbeat_seconds: 5
    cancellation_grace_seconds: 5
  output_limits:
    max_stdout_bytes: 262144
    max_stderr_bytes: 262144
    max_lines: 400
  concurrency:
    max_parallel_reads: 8
    max_parallel_processes: 2
    write_conflict_policy: deny

  workspace_state:
    baselines_directory: "@data/baselines"
    baselines_ttl_days: 7
    checkpoints_directory: "@data/checkpoints"
    checkpoints_max_turns: 10
    checkpoints_ttl_days: 2
    compression_enabled: true
    large_file_threshold_mb: 1


# Durable execution store (SQLite) configuration
execution_store:
  enabled: true
  # Database path (supports @ aliases or absolute)
  db_path: "@data/execution_store.db"
  # Writer queue settings
  flush_interval_ms: 1000  # Flush batch every second
  batch_size: 100  # Max operations per batch
  # Retention policy in days per table type
  retention_days:
    default: 30  # Default retention for all data
    sessions: 30
    frames: 30
    messages: 30
    events: 30
    tools: 365  # Global tools retained longer
    templates: 365  # Global templates retained longer

# OpenTelemetry tracing (OTLP/gRPC, Jaeger-compatible)
telemetry:
  enabled: false  # Set true (or OTEL_EXPORTER_OTLP_ENDPOINT) to export spans
  service_name: "locca-runtime"
  otlp_endpoint: null  # e.g. http://localhost:4317
  console_export: false  # Also print spans to console (debug)
