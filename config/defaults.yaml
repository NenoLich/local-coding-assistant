# Default configuration for Local Coding Assistant
# This file provides fallback values when no other configuration is specified

# Environment variables can override these defaults using the LOCCA_ prefix:
# LOCCA_LLM__TEMPERATURE, LOCCA_LLM__MAX_TOKENS, etc.

llm:
  # LLM generation settings
  temperature: 0.1
  max_tokens: 1000
  max_retries: 1
  retry_delay: 1.0
  capture_reasoning: true
  reasoning_max_chars: 1000
  # Whether to automatically register unmapped models with LiteLLM to bypass cost mapping
  auto_register_litellm_models: true
  # Providers will be dynamically managed at runtime
  providers: []

runtime:
  # Default runtime behavior
  persistent_sessions: false
  max_session_history: 100
  enable_logging: true
  log_level: "INFO"
  agent_mode: "no_agent"
  stream: true
  # Tool calling mode: 'classic' (default), 'ptc' (programmatic tool calling), 'reasoning_only' (no tool calls)
  tool_call_mode: "classic"

dashboard:
  # Dashboard configuration
  enabled: true
  port: 8080
  host: "localhost"
  auto_start: false  # Whether to auto-start dashboard with LOCCA

providers: {}

agent:
  # Agent profiles define different behaviors and configurations
  profiles:
    default:
      name: "default"
      kind: "default"
      description: "Primary coding assistant focused on safe, step-by-step reasoning with practical guidance."
      goals:
        - "Deliver concise answers grounded in repository state"
        - "Surface trade-offs and assumptions explicitly"
      tone: "Confident, pragmatic, collaborative"
      constraints:
        - "Never fabricate file paths or code"
        - "Prefer actionable steps over vague suggestions"
      model_policy: "general"

    planner:
      name: "planner"
      kind: "planner"
      description: "Decomposes the request into executable steps and highlights risks."
      goals:
        - "Summarize objectives"
        - "Outline numbered plan with verification points"
      tone: "Analytical and structured"
      model_policy: "planning_mode"

    executor:
      name: "executor"
      kind: "executor"
      description: "Executes the plan, writes code, and validates results."
      goals:
        - "Apply plan precisely"
        - "Capture diffs and side-effects"
        - "Report blockers or verifications needed"
      tone: "Hands-on and detail oriented"
      model_policy: "general"

  # Include your custom policies directly
  policies:
    # Plan mode with strong reasoning
    planning_mode:
      models:
        - "mistral-ai/Codestral-2501"
        - "z-ai/glm-4.5-air:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "exponential"

    # Custom policy with exponential backoff
    coding_task:
      models:
        - "mistral-ai/Codestral-2501"
        - "kwaipilot/kat-coder-pro:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "exponential"

    # Fast policy for simple tasks
    general:
      models:
        - "cohere/north-mini-code:free"
        - "nvidia/nemotron-3-ultra-550b-a55b:free"
        - "fallback:any"
      max_failovers: 3
      fallback_strategy: "sequential"

    # Cost-optimized policy
    budget_mode:
      models:
        - "kwaipilot/kat-coder-pro:free"
        - "github_models:microsoft/Phi-4"
        - "fallback:any"
      max_failovers: 1
      fallback_strategy: "sequential"

# Prompt template configuration
prompt:
  # Root directory for prompt templates (set to null to use package defaults)
  template_root: null
  
  # Jinja2 environment settings
  enable_jinja_autoescape: false
  trim_blocks: true
  lstrip_blocks: true
  
  # Template paths (relative to template_root)
  templates:
    system: "base/system_core.jinja2"
    execution_rules: "base/execution_rules.jinja2"
    agent_identity: "base/agent_identity.jinja2"
    skills: "blocks/skills.jinja2"
    memories: "blocks/memories.jinja2"
    tools_prompt: "blocks/tools_prompt.jinja2"
    examples: "blocks/examples.jinja2"
    repo_context: "blocks/repo_context.jinja2"
    constraints: "blocks/constraints.jinja2"

sandbox:
  enabled: false
  image: "locca-sandbox:latest"
  timeout: 30
  memory_limit: "512m"
  cpu_limit: 0.5
  network_enabled: false
  max_code_length: 10000
  max_file_size: 1048576
  allowed_directories:
    - '/workspace'
  working_directory: "/workspace"
  session_timeout: 300
  max_sessions: 5
  session_id: "default"
  persistence: true
  # Security settings
  # By default, we allow all imports and patterns because we rely on Docker isolation.
  # The agent needs to be able to run code, open files, and install packages.
  allowed_imports:
    - json
    - yaml
    - datetime
    - pathlib
    - typing
    - re
    - math
    - random
    - time
    - collections
    - itertools
    - functools
    - tools_api
    # - requests
  blocked_patterns:
    - "eval\\("
    - "exec\\("
    - "__import__"
    - "compile\\("
    - "globals\\("
    - "locals\\("
    - "open\\("
    - "os\\."
    - "shutil\\."
    - "getattr\\(__builtins__"
    - "getattr\\(__builtins__,"
    - "builtins\\."
  blocked_shell_commands:
    - "rm"
    - "mv"
    - "cp"
    - "dd"
    - "chmod"
    - "chown"
    - "sudo"
    - "su"
    - "mount"
    - "umount"
    - "curl"
    - "wget"
    - "scp"
    - "nc"
    - "netcat"
    - "ssh"
    - "iptables"
    - "systemctl"
    - "service"
    - "kill"
    - "pkill"
    - "ps"
    - "top"
    - "nmap"
    - "python"
    - "pip"
    - "systemctl"
    - "service"
    - "shutdown"
    - "reboot"
    - "ftp"
    - "venv"
    - "virtualenv"
  # Logging configuration
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    console: true  # Enable console logging
    file: true  # Enable file logging
    directory: "/workspace/logs"  # Directory to store log files (inside container)
    file_name: "container_{session_id}.log"  # Log file name pattern
    max_size: 10485760  # Maximum log file size in bytes before rotation (10MB)
    backup_count: 5  # Number of backup log files to keep

# Repository context service configuration
repository:
  enabled: true

  # Storage settings
  storage:
    mode: "temporary"  # 'temporary' or 'persistent'
    persistent_db_path: ".locca/repo_context.db"
    temp_db_dir: "@data/temp"
    temp_db_naming_strategy: "path_hash"  # 'path_hash' (folder_name_hash) or 'uuid'
    max_cum_file_size: 25000000  # Maximum cumulative file size in bytes to index in temporary storage (25MB)

  # File filtering settings (for re-indexing only)
  file_filter:
    supported_extensions:
      - ".py"
      - ".js"
      - ".jsx"
      - ".ts"
      - ".tsx"
      - ".rs"
      - ".go"
      - ".c"
      - ".cpp"
      - ".h"
      - ".hpp"
    max_file_size_kb: 500  # 500KB default

  # File monitoring settings (git-tracked only)
  file_monitoring:
    enabled: true
    use_git_tracking: true # Monitor files if they are git tracked
    notify_on_changes: true  # Emit system notifications for file changes
    notification_types:
      - "modified"
      - "created"
      - "deleted"

  # AST parsing settings
  ast_parser:
    language_pack: "tree-sitter-language-pack"

  # Repo map settings
  repo_map:
    max_symbols: 100  # Maximum number of symbols to include in repo map (pageranked)
    include_docstrings: false
    include_imports: false
    # Symbol types to include in repo map (for pageranking)
    included_symbol_types:
      - "function"
      - "method"
      - "class"
      - "interface"
      - "type_alias"

  # Call graph settings
  call_graph:
    # Per-language relationship weights for PageRank computation
    # Higher weights give more importance to that relationship type in the ranking
    relationship_weights:
      python:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      javascript:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      typescript:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      rust:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      go:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0
      # Default weights for unsupported languages
      default:
        call: 1.5
        type_reference: 1.2
        inherits: 1.0
        belongs_to: 0.2
        contains: 0.0

  # Indexing settings
  indexing:
    startup_enabled: true
    startup_parallel_workers: 4
    agent_edit_enabled: true
    user_edit_enabled: true
    debounce_window: 2.0
    max_cumulative_file_size_kb: 10000  # Max cumulative file size for batch indexing (default 10MB)
