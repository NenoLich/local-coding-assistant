# Default provider configuration for Local Coding Assistant
#
# Supported model parameters (OptionalParameters fields, per-model via
# `supported_parameters`):
#   tools, tool_choice, stream, response_format, max_tokens, top_p,
#   presence_penalty, frequency_penalty, top_k, seed, stop,
#   include_reasoning, reasoning_effort, include_usage, extra_body,
#   cache_control
#
# cache_control is applied by the driver to eligible messages (last system,
# last tool, last user) when set on the request, e.g.:
#   cache_control: {"type": "ephemeral"}
#
providers:
  openrouter:
    driver: "openai_chat"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    health_check_endpoint: "https://openrouter.ai/api/v1/key"
    models:
      nvidia/nemotron-3-ultra-550b-a55b:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      baidu/ernie-5.5-flash-preview:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      inclusionai/ling-3.2-flash:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      particle-ai/particle-1:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      recursive/flint-v1.0:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
  google_gemini:
    driver: "openai_chat"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    health_check_endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/models"
    models:
      gemini-3.5-flash-lite:
        supported_parameters: ["tools", "reasoning_effort", "max_tokens", "stream", "tool_choice", "response_format", "extra_body.thinking_config", "include_usage"]
      gemini-3.6-flash:
        supported_parameters: [ "tools", "reasoning_effort", "max_tokens", "stream", "tool_choice", "response_format", "extra_body.thinking_config", "include_usage" ]
  github_models:
    driver: "openai_chat"
    base_url: "https://models.github.ai/inference"
    api_key_env: "GITHUB_TOKEN"
    health_check_endpoint: "https://models.github.ai/catalog/models"
    models:
      mistral-ai/Codestral-2501:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format"]
      microsoft/Phi-4-mini-instruct:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty"]
  groq:
    driver: "openai_chat"
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    health_check_endpoint: "https://api.groq.com/openai/v1/models"
    models:
      groq/compound:
        supported_parameters: ["max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format"]
      groq/compound-mini:
        supported_parameters: ["max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format" ]
  nvidia:
    driver: "openai_chat"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    health_check_endpoint: "https://integrate.api.nvidia.com/v1/models"
    models:
      nvidia/nemotron-3.5-super-vl-120b-a12b:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage", "extra_body"]
        extra_body:
          chat_template_kwargs:
            enable_thinking: true
