providers:
  openrouter:
    driver: "openai_chat"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    health_check_endpoint: "https://openrouter.ai/api/v1/key"
    models:
      nvidia/nemotron-3-ultra-550b-a55b:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      inclusionai/ling-3.0-flash:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format", "include_usage"]
      cohere/north-mini-code:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "include_usage"]
      poolside/laguna-s-2.1:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
      z-ai/glm-4.5-air:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "include_usage"]
      kwaipilot/kat-coder-pro:free:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "response_format", "structured outputs", "stream", "include_usage"]
  google_gemini:
    driver: "openai_chat"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    health_check_endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/models"
    models:
      gemini-3.5-flash-lite:
        supported_parameters: ["tools", "reasoning_effort", "max_tokens", "stream", "tool_choice", "response_format", "extra_body.thinking_config"]
      gemini-3.6-flash:
        supported_parameters: [ "tools", "reasoning_effort", "max_tokens", "stream", "tool_choice", "response_format", "extra_body.thinking_config" ]
  github_models:
    driver: "openai_chat"
    base_url: "https://models.github.ai/inference"
    api_key_env: "GITHUB_TOKEN"
    health_check_endpoint: "https://models.github.ai/catalog/models"
    models:
      mistral-ai/Codestral-2501:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format"]
      microsoft/Phi-4-mini-instruct:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty"]
  groq:
    driver: "openai_chat"
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    health_check_endpoint: "https://api.groq.com/openai/v1/models"
    models:
      groq/compound:
        supported_parameters: ["max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format"]
      groq/compound-mini:
        supported_parameters: ["max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "response_format" ]
  nvidia:
    driver: "openai_chat"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    health_check_endpoint: "https://integrate.api.nvidia.com/v1/models"
    models:
      minimaxai/minimax-m3:
        supported_parameters: ["tools", "tool_choice", "max_tokens", "temperature", "top_p", "stop", "frequency_penalty", "presence_penalty", "seed", "top_k", "repetition_penalty", "include_usage"]
