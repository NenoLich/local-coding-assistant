# Tool Policies - Complete Rule Set
# This file contains ALL approval rules with explicit priorities.
# Higher priority = evaluated first.
# Project overrides in tool_policies.local.yaml only change outcome (ASK -> ALLOW).

tools_platform:
  # Configurable paths for tool policies files (supports @ aliases)
  tool_policies_path: "@config/tool_policies.yaml"
  tool_policies_local_path: "@config/tool_policies.local.yaml"
  rules:
    # === BASE PER-TOOL POLICIES (priority 100) ===
    - id: "base_read_file"
      tool_id: "read_file"
      matcher:
        type: "any_args"
      outcome: "allow"
      priority: 100
      description: "Base policy for read_file"

    - id: "base_search_text"
      tool_id: "search_text"
      matcher:
        type: "any_args"
      outcome: "allow"
