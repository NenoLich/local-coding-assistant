    # === WORKSPACE BOUNDARY (priority 200-210) ===
    - id: "boundary_read_outside"
      tool_id: ["read_file", "search_text", "match_paths"]
      matcher:
        type: "path_outside_workspace"
      outcome: "ask"
      priority: 210
      description: "Reading outside workspace requires approval"

    - id: "boundary_write_outside"
      tool_id: ["create_file", "replace_exact", "delete_file"]
      matcher:
        type: "path_outside_workspace"
      outcome: "ask"
      priority: 220
      description: "Writing outside workspace is not allowed"

    # === HEURISTICS (priority 160) ===
    - id: "heuristic_shell_mode"
      tool_id: "run_command"
      matcher:
        type: "arg_equals"
        arg: "shell_mode"
        value: true
      outcome: "ask"
      priority: 160
      description: "Shell mode execution requires approval"

    - id: "heuristic_network"
      tool_id: "run_command"
      matcher:
        type: "arg_equals"
        arg: "allow_network"
        value: true
      outcome: "ask"
      priority: 160
      description: "Network access requires approval"

    # === GLOBAL FALLBACK (priority 0) ===
    - id: "fallback"
      tool_id: "*"
      matcher:
        type: "any_args"
      outcome: "ask"
      priority: 0
      description: "Global fallback"

  # === PROJECT OVERRIDES (auto-populated by YES_ALWAYS_PROJECT) ===
